AllCops:
  NewCops: enable
  TargetRubyVersion: 2.7
  SuggestExtensions: false

Gemspec/DevelopmentDependencies:
  Enabled: false

# The wrapper is by nature a single file with FFI declarations + several
# methods that walk libpng's chunked API; splitting would obscure the
# 1-to-1 mapping with the C API.
Metrics/AbcSize:
  Max: 70
Metrics/ClassLength:
  Max: 200
Metrics/CyclomaticComplexity:
  Max: 20
Metrics/MethodLength:
  Max: 70
Metrics/ModuleLength:
  Max: 350
Metrics/PerceivedComplexity:
  Max: 20
Metrics/ParameterLists:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
    - Rakefile
    - libpng.gemspec

Style/SpecialGlobalVars:
  Exclude:
    - ext/extconf.rb
Style/FrozenStringLiteralComment:
  Exclude:
    - ext/extconf.rb
    - lib/libpng/recipe.rb

# libpng's C function names use mixed case + digits (e.g.
# png_set_strip_16, png_set_expand_gray_1_2_4_to_8). We attach them
# via FFI with their canonical names so docs and headers cross-
# reference cleanly.
Naming/VariableNumber:
  Exclude:
    - lib/libpng/binding.rb
