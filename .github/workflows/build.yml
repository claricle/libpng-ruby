name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.adoc'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  test:
    name: Test on Ruby ${{ matrix.ruby.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}

    # libpng's CMake needs cmake >= 3.10 and a working zlib. Both are
    # pre-installed on GitHub Actions runners; this is just a sanity check.
    - name: Install build tools
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zlib1g-dev

    - name: Install build tools (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install cmake ninja

    - name: Install build tools (Windows)
      if: startsWith(matrix.os, 'windows')
      uses: step-security/msvc-dev-cmd@v1

    - run: bundle exec rake

  build:
    name: build ${{ matrix.os }}, ${{ matrix.ruby-version }}, ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: any
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: ubuntu-latest
            platform: aarch64-linux
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-latest
            platform: x64-mingw32
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: macos-latest
            platform: x86_64-darwin
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: macos-latest
            platform: arm64-darwin
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@master
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Install build tools (Linux)
      if: startsWith(matrix.os, 'ubuntu') && matrix.platform != 'aarch64-linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zlib1g-dev

    - name: Install build tools (Linux cross aarch64)
      if: startsWith(matrix.os, 'ubuntu') && matrix.platform == 'aarch64-linux'
      run: |
        # Ubuntu 24.04 noble's default apt sources (archive.ubuntu.com) don't
        # carry arm64 packages. Restrict existing sources to amd64 and add
        # ports.ubuntu.com for arm64.
        sudo dpkg --add-architecture arm64
        sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
        sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<'EOF'
        Types: deb
        Architectures: arm64
        URIs: http://ports.ubuntu.com/ubuntu-ports/
        Suites: noble noble-updates noble-backports
        Components: main universe restricted multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        Architectures: arm64
        URIs: http://ports.ubuntu.com/ubuntu-ports/
        Suites: noble-security
        Components: main universe restricted multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          zlib1g-dev:arm64

    - name: Install build tools (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install cmake ninja

    - name: Install build tools (Windows)
      if: startsWith(matrix.os, 'windows')
      uses: step-security/msvc-dev-cmd@v1

    - run: bundle exec rake gem:native:${{ matrix.platform }}

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

    - name: Install gem
      run: gem install -b pkg/libpng-*.gem

    - name: Test conversion
      if: matrix.platform != 'aarch64-linux'
      shell: bash
      run: |
        ruby -rlibpng -e 'png = Libpng.encode(2, 2, "\xff" * 16, pixel_format: "RGBA"); File.binwrite("test.png", png); puts Libpng.decode(png, pixel_format: "RGBA").inspect'
