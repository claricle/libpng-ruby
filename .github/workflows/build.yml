name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.adoc'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  test:
    name: Test on Ruby ${{ matrix.ruby.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}

    # libpng's CMake needs cmake >= 3.10 and a working zlib. Both are
    # pre-installed on GitHub Actions runners; this is just a sanity check.
    - name: Install build tools
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zlib1g-dev

    - name: Install build tools (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install cmake ninja

    - name: Install build tools (Windows)
      if: startsWith(matrix.os, 'windows')
      uses: step-security/msvc-dev-cmd@v1

    - run: bundle exec rake

  build:
    name: build ${{ matrix.os }}, ${{ matrix.ruby-version }}, ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: any
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-latest
            platform: x64-mingw32
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-version: '3.4'
          - os: macos-15-intel
            platform: x86_64-darwin
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: macos-latest
            platform: arm64-darwin
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@master
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Install build tools (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zlib1g-dev

    - name: Install build tools (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install cmake ninja

    - name: Install build tools (Windows)
      if: startsWith(matrix.os, 'windows')
      uses: step-security/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.platform == 'aarch64-mingw-ucrt' && 'arm64' || 'x64' }}

    - run: bundle exec rake gem:native:${{ matrix.platform }}

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

    - name: Install gem
      run: gem install -b pkg/libpng-*.gem

    - name: Test conversion
      shell: bash
      run: |
        ruby -rlibpng -e 'png = Libpng.encode(2, 2, "\xff" * 16, pixel_format: "RGBA"); File.binwrite("test.png", png); puts Libpng.decode(png, pixel_format: "RGBA").inspect'

  build_musl:
    name: build ${{ matrix.platform }} (Alpine)
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl

    steps:
    - uses: actions/checkout@v4

    # Run the entire build inside an Alpine container via `docker run` rather
    # than the workflow `container:` field. The latter only works on x64
    # runners (Actions' JS runtime has no arm64-musl build), but arm64 Ubuntu
    # runners can run arm64 Alpine images natively via Docker.
    - name: Build in Alpine container
      shell: bash
      env:
        PLATFORM: ${{ matrix.platform }}
        RUBY_VERSION: ${{ needs.prepare.outputs.default-ruby-version }}
      run: |
        cat > /tmp/alpine-build.sh <<'BUILD_EOF'
        #!/bin/sh
        set -e
        apk add --no-cache build-base cmake ninja git file zlib-dev
        # The mounted /work volume is owned by the host runner user; git in
        # the container (running as root) refuses to operate on it without
        # this. Without it, `git ls-files` in the gemspec returns empty and
        # the built gem is missing lib/libpng.rb.
        git config --global --add safe.directory /work
        bundle install --jobs 4
        bundle exec rake "gem:native:${PLATFORM}"
        gem install -b pkg/libpng-*.gem
        # Smoke test from /tmp so bundler's source-tree LOAD_PATH doesn't
        # shadow the installed gem. Activate via `gem` so RubyGems resolves
        # the platform-specific binary gem (Alpine Ruby's platform string
        # is *-linux-musl, which must match the gem's platform suffix).
        (cd /tmp && ruby -e 'gem "libpng"; require "libpng"; png = Libpng.encode(2, 2, "\xff" * 16, pixel_format: "RGBA"); File.binwrite("test.png", png); puts Libpng.decode(png, pixel_format: "RGBA").inspect')
        BUILD_EOF
        chmod +x /tmp/alpine-build.sh
        docker run --rm \
          -v "$PWD:/work" \
          -v /tmp/alpine-build.sh:/alpine-build.sh \
          -w /work \
          -e PLATFORM \
          ruby:${RUBY_VERSION}-alpine \
          /alpine-build.sh

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

  # OHOS (OpenHarmony / Huawei HarmonyOS PC) requires the official OHOS
  # NDK to cross-compile. The NDK's clang and binary-sign-tool are x86_64
  # ELF binaries; on this arm64 runner they run transparently via
  # binfmt_misc + qemu-user-static. Verification (dockerharmony) runs
  # natively because the arm64 rootfs matches the host architecture.
  build_ohos:
    name: build aarch64-linux-ohos (NDK)
    runs-on: ubuntu-24.04-arm
    needs: prepare
    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
        bundler-cache: true

    - name: Install build tools + qemu-user-static
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build zlib1g-dev curl jq unzip \
                                 qemu-user-static binfmt-support

    - name: Register binfmt for x86_64 (NDK binaries are x86_64 ELF)
      run: |
        sudo update-binfmts --enable qemu-x86_64 || true
        # Smoke-check: a trivial x86_64 binary should run transparently.
        docker run --rm --platform linux/amd64 alpine:latest echo "binfmt ok"

    - name: Cache OHOS NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: ext/ohos/ndk
        key: ohos-ndk-arm64-${{ hashFiles('ext/ohos/setup-ndk.sh') }}

    - name: Setup OHOS NDK
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: sh ext/ohos/setup-ndk.sh --prefix ext/ohos/ndk

    - name: Build OHOS gem (libpng + static zlib + signing)
      run: bundle exec rake gem:native:aarch64-linux-ohos
      env:
        target_platform: aarch64-linux-ohos

    - name: Prepare dockerharmony artifacts
      run: NDK_ROOT=$PWD/ext/ohos/ndk sh ext/ohos/verify-prepare.sh

    - name: Verify in dockerharmony (real OHOS userland)
      run: |
        docker pull ghcr.io/hqzing/dockerharmony:latest
        docker run --rm \
          -v "$PWD/ohos-verify:/work" \
          -w /work \
          ghcr.io/hqzing/dockerharmony:latest \
          sh -c 'LD_LIBRARY_PATH=. ./smoke-test'

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-aarch64-linux-ohos
        path: pkg/*.gem